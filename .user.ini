; GeoGene - PHP limits for certificate photo uploads / Bulk Scan.
; Hostinger reads .user.ini (can take ~5 minutes to apply). You can also set
; the same values in hPanel > Websites > Manage > PHP Configuration.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 100
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
display_errors = Off
log_errors = On
